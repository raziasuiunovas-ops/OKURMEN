<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#FF6B00" stroke-width="20"/>
  
  <!-- Glasses -->
  <g id="glasses" fill="none" stroke="#FF6B00" stroke-width="12" stroke-linecap="round">
    <!-- Left lens -->
    <rect x="135" y="190" width="110" height="50" rx="8" ry="8"/>
    <!-- Right lens -->
    <rect x="265" y="190" width="110" height="50" rx="8" ry="8"/>
    <!-- Bridge -->
    <line x1="245" y1="215" x2="265" y2="215"/>
    <!-- Left eyebrow -->
    <path d="M 130 160 Q 190 150 210 165"/>
    <!-- Right eyebrow -->
    <path d="M 290 130 Q 330 145 380 155"/>
  </g>
  
  <!-- Text ОКУРМЭН -->
  <text x="250" y="310" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#001F5C" text-anchor="middle">
    ОКУРМЭН
  </text>
  
  <!-- Text ОКУУ БОРБОРУ -->
  <text x="250" y="365" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#001F5C" text-anchor="middle">
    ОКУУ БОРБОРУ
  </text>
</svg>
